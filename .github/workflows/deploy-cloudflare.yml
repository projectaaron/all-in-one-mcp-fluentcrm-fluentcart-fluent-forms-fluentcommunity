# Deploy the Worker to Cloudflare on demand (Actions tab → Deploy to
# Cloudflare Workers → Run workflow, or via the API).
#
# NOTE: GitHub only registers workflow_dispatch workflows that exist on the
# repository's DEFAULT branch — this file must be merged there before the
# Run workflow button (or API dispatch) works.
#
# One-time setup — add two repository secrets (Settings → Secrets and
# variables → Actions):
#   CLOUDFLARE_API_TOKEN   Create at dash.cloudflare.com/profile/api-tokens
#                          with the "Edit Cloudflare Workers" template.
#   CLOUDFLARE_ACCOUNT_ID  Dashboard → Workers & Pages → right sidebar
#                          (optional if the token is scoped to one account).
#
# Deploys only update code — the Worker's stored secrets (FLUENT_SITE_URL,
# FLUENT_API_USERNAME, FLUENT_API_PASSWORD, FLUENT_MCP_TOKEN) persist, and
# keep_vars in wrangler.jsonc protects dashboard-added plaintext vars, so
# the connector URL keeps working across deploys.
name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Wrangler v4 requires Node >= 22 and exits immediately on anything
          # older. package.json's engines floor (>=20.6) covers the server
          # itself, not the deploy toolchain — don't lower this to match it.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Without this, a missing secret surfaces as an opaque one-second
      # wrangler failure ("not logged in") after a full install-and-test run.
      - name: Check Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is not set — add it under Settings → Secrets and variables → Actions (create the token at dash.cloudflare.com/profile/api-tokens with the 'Edit Cloudflare Workers' template)."
            exit 1
          fi
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
