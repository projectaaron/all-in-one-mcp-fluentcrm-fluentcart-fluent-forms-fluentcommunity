# Deploy the Worker to Cloudflare on demand (Actions tab → Deploy to
# Cloudflare Workers → Run workflow, or via the API).
#
# One-time setup — add two repository secrets (Settings → Secrets and
# variables → Actions):
#   CLOUDFLARE_API_TOKEN   Create at dash.cloudflare.com/profile/api-tokens
#                          with the "Edit Cloudflare Workers" template.
#   CLOUDFLARE_ACCOUNT_ID  Dashboard → Workers & Pages → right sidebar
#                          (optional if the token is scoped to one account).
#
# Deploys only update code — the Worker's stored secrets (FLUENT_SITE_URL,
# FLUENT_API_USERNAME, FLUENT_API_PASSWORD, FLUENT_MCP_TOKEN) persist, and
# keep_vars in wrangler.jsonc protects dashboard-added plaintext vars, so
# the connector URL keeps working across deploys.
name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
