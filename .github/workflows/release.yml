# Build the two downloadable bundles and attach them to a GitHub release.
# Upload the .mcpb to the Freemius product / upfluent.io afterwards so the
# one-click download matches the release.
#
# Two ways to run it — no terminal required for the first:
#   • Actions tab → Release → Run workflow (uses the version in package.json
#     and creates the v<version> tag itself)
#   • push a v<version> tag
#
# Re-running for a version that already has a release is refused — bump the
# version in package.json / src/version.ts first.
#
# Produces:
#   fluentmcp-<version>.mcpb          Claude Desktop extension (dist + prod deps)
#   fluentmcp-<version>-source.zip    source bundle for config-file / remote installs
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Resolve the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$PKG" != "$TAG" ]; then
              echo "::error::Tag v$TAG does not match package.json version $PKG — bump the version first."
              exit 1
            fi
          elif gh release view "v$PKG" >/dev/null 2>&1; then
            echo "::error::Release v$PKG already exists — bump the version in package.json and src/version.ts, merge, then run again."
            exit 1
          fi
          echo "VERSION=$PKG" >> "$GITHUB_ENV"
      - name: Pack the desktop extension
        run: |
          npm run pack:extension
          mv fluentmcp.mcpb "fluentmcp-${VERSION}.mcpb"
      - name: Pack the source bundle
        run: git archive --format=zip --prefix=fluentmcp/ -o "fluentmcp-${VERSION}-source.zip" HEAD
      - name: Create the GitHub release with both assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" --target "$GITHUB_SHA" \
            "fluentmcp-${VERSION}.mcpb" \
            "fluentmcp-${VERSION}-source.zip" \
            --title "All-In-One MCP for Fluent Suite ${VERSION}" \
            --notes "See CHANGELOG.md for what changed. Download the .mcpb for Claude Desktop, or the source bundle for config-file and remote installs."
