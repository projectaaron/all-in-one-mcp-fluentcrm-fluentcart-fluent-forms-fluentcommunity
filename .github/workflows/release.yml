# Build the two downloadable bundles and attach them to a GitHub release.
# Upload the .mcpb to the Freemius product / upfluent.io afterwards so the
# one-click download matches the release.
#
# Two ways to run it — no terminal required for the first:
#   • Actions tab → Release → Run workflow (uses the version in package.json
#     and creates the v<version> tag itself)
#   • push a v<version> tag
#
# Re-running for a version that already has a release is refused — bump the
# version in package.json / src/version.ts first.
#
# Produces:
#   fluentmcp-<version>.mcpb                          Claude Desktop extension (dist + prod deps)
#   all-in-one-mcp-for-fluent-suite-<version>.zip     the .mcpb + readme.txt + LICENSE (Freemius / upfluent.io download)
#   fluentmcp-<version>-source.zip                    source bundle for config-file / remote installs
# and, when the FREEMIUS_DEV_ID / FREEMIUS_DEV_PUBLIC_KEY / FREEMIUS_DEV_SECRET_KEY
# secrets are set, uploads the download ZIP to Freemius product 39849 as a
# released version (scripts/publish-freemius.mjs).
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Resolve the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$PKG" != "$TAG" ]; then
              echo "::error::Tag v$TAG does not match package.json version $PKG — bump the version first."
              exit 1
            fi
          elif gh release view "v$PKG" >/dev/null 2>&1; then
            echo "::error::Release v$PKG already exists — bump the version in package.json and src/version.ts, merge, then run again."
            exit 1
          fi
          echo "VERSION=$PKG" >> "$GITHUB_ENV"
      - name: Pack the desktop extension
        run: |
          npm run pack:extension
          mv fluentmcp.mcpb "fluentmcp-${VERSION}.mcpb"
      - name: Pack the source bundle
        run: git archive --format=zip --prefix=fluentmcp/ -o "fluentmcp-${VERSION}-source.zip" HEAD
      - name: Pack the end-user download (mcpb + readme + license)
        run: |
          node scripts/pack-download.mjs "fluentmcp-${VERSION}.mcpb"
          # Fixed-name copies so one URL always serves the newest version:
          #   https://github.com/projectaaron/fluentMCP/releases/latest/download/all-in-one-mcp-for-fluent-suite-latest.zip
          #   https://github.com/projectaaron/fluentMCP/releases/latest/download/fluentmcp-latest.mcpb
          # (Freemius "Download Links" and upfluent.io point at these.)
          cp "all-in-one-mcp-for-fluent-suite-${VERSION}.zip" all-in-one-mcp-for-fluent-suite-latest.zip
          cp "fluentmcp-${VERSION}.mcpb" fluentmcp-latest.mcpb
      - name: Create the GitHub release with the assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" --target "$GITHUB_SHA" \
            "fluentmcp-${VERSION}.mcpb" \
            "all-in-one-mcp-for-fluent-suite-${VERSION}.zip" \
            "fluentmcp-${VERSION}-source.zip" \
            all-in-one-mcp-for-fluent-suite-latest.zip \
            fluentmcp-latest.mcpb \
            --title "All-In-One MCP for Fluent Suite ${VERSION}" \
            --notes "See CHANGELOG.md for what changed. Download the .mcpb for Claude Desktop (or the all-in-one ZIP with a readme), or the source bundle for config-file and remote installs."
      # Freemius "Apps & Software" products have no version upload
      # (app_deployment_not_supported); their download is a fixed link to the
      # *-latest.zip asset above, set once under Product → Settings → Download
      # Links. This step keeps the version upload for the day Freemius adds
      # it, and until then reports the stable link. Skipped (not failed) until
      # the three FREEMIUS_DEV_* repository secrets exist.
      - name: Publish to Freemius
        env:
          FREEMIUS_DEV_ID: ${{ secrets.FREEMIUS_DEV_ID }}
          FREEMIUS_DEV_PUBLIC_KEY: ${{ secrets.FREEMIUS_DEV_PUBLIC_KEY }}
          FREEMIUS_DEV_SECRET_KEY: ${{ secrets.FREEMIUS_DEV_SECRET_KEY }}
          FREEMIUS_PRODUCT_ID: "39849"
        run: |
          if [ -z "$FREEMIUS_DEV_SECRET_KEY" ]; then
            echo "::notice::FREEMIUS_DEV_* secrets not set — skipping the Freemius upload (upload all-in-one-mcp-for-fluent-suite-${VERSION}.zip in the Freemius dashboard instead)."
            exit 0
          fi
          node scripts/publish-freemius.mjs --file "all-in-one-mcp-for-fluent-suite-${VERSION}.zip" --version "$VERSION" --release-mode released
