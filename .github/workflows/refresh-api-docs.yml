name: Refresh API docs
# Regenerates the FluentCart docs (docs/api/) from the upstream OpenAPI specs
# on a schedule, and opens (or updates) a single PR whenever the API has
# changed. Runs on GitHub's runners, which have outbound internet to
# dev.fluentcart.com.
on:
  schedule:
    - cron: '17 6 * * 1'   # weekly, Mondays 06:17 UTC
  workflow_dispatch: {}     # allow manual runs

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-api-docs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Regenerate FluentCart API docs (OpenAPI specs)
        run: node scripts/gen-api-docs.mjs

      - name: Open or update a PR if the API changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Who to notify (review request + assignee + @mention). GitHub emails
          # these by default per the recipient's notification settings.
          NOTIFY_USER: projectaaron
        run: |
          set -euo pipefail
          # git status --porcelain (not `git diff --quiet`) so newly CREATED
          # doc files — e.g. a brand-new API resource group — count as changes.
          if [ -z "$(git status --porcelain)" ]; then
            echo "No API changes — nothing to do."
            exit 0
          fi

          BRANCH="auto/api-docs-refresh"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A
          git commit -m "docs(api): scheduled FluentCart API docs refresh"
          git push -f -u origin "$BRANCH"

          # Summarize what changed for the PR body.
          SUMMARY=$(git show --stat --oneline HEAD | head -40)

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "docs(api): scheduled FluentCart API docs refresh" \
              --assignee "$NOTIFY_USER" \
              --reviewer "$NOTIFY_USER" \
              --body "$(printf 'cc @%s — automated refresh via `scripts/gen-api-docs.mjs`; the upstream FluentCart API changed.\n\nReview the diff for **added / removed endpoints** and any schema changes, then merge.\n\nChanged files:\n```\n%s\n```\n\n🤖 Generated by the Refresh API docs workflow.' "$NOTIFY_USER" "$SUMMARY")" \
              || gh pr create --base main --head "$BRANCH" \
                   --title "docs(api): scheduled FluentCart API docs refresh" \
                   --body "cc @${NOTIFY_USER} — automated API docs refresh (reviewer/assignee could not be set automatically)."
          else
            # PR already open — force-push above updated it; ping with a comment so
            # the new changes are noticed too.
            gh pr comment "$BRANCH" --body "@${NOTIFY_USER} refreshed with the latest upstream API changes." || true
            echo "Updated existing PR for $BRANCH."
          fi
