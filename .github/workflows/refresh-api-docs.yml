name: Refresh API docs
# Regenerates every Fluent product's API reference (docs/api-reference/) from
# the upstream OpenAPI specs on a schedule, and opens (or updates) a single PR
# whenever any product's API has changed. Runs on GitHub's runners, which have
# outbound internet to dev.fluentcart.com and developers.fluentcrm.com.
on:
  schedule:
    - cron: '17 6 * * 1'   # weekly, Mondays 06:17 UTC
  workflow_dispatch: {}     # allow manual runs

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-api-docs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Regenerate Fluent product API references (OpenAPI specs)
        run: node scripts/gen-api-docs.mjs

      # NOTE: creating a PR with the default GITHUB_TOKEN requires the repo
      # setting  Settings → Actions → General → Workflow permissions →
      # "Allow GitHub Actions to create and approve pull requests", which is
      # OFF by default on new repos. Enable it once, or point GH_TOKEN at a
      # PAT / GitHub App token. Without it the branch pushes fine but
      # `gh pr create` fails on the first run where the API changed.
      - name: Open or update a PR if the API changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Who to notify (review request + assignee + @mention). GitHub emails
          # these by default per the recipient's notification settings.
          NOTIFY_USER: projectaaron
          # Read the base off the repo rather than hardcoding it — this repo's
          # default branch is not `main`, and a hardcoded base breaks silently
          # if it is ever renamed.
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # git status --porcelain (not `git diff --quiet`) so newly CREATED
          # doc files — e.g. a brand-new API resource group — count as changes.
          if [ -z "$(git status --porcelain)" ]; then
            echo "No API changes — nothing to do."
            exit 0
          fi

          BRANCH="auto/api-docs-refresh"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A
          git commit -m "docs(api): scheduled Fluent API docs refresh"
          git push -f -u origin "$BRANCH"

          # Summarize what changed for the PR body.
          SUMMARY=$(git show --stat --oneline HEAD | head -40)

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            if ! gh pr create \
              --base "$BASE_BRANCH" \
              --head "$BRANCH" \
              --title "docs(api): scheduled Fluent API docs refresh" \
              --body "$(printf 'cc @%s — automated refresh via `scripts/gen-api-docs.mjs`; an upstream Fluent product API changed.\n\nReview the diff for **added / removed endpoints** and any schema changes, then merge.\n\nChanged files:\n```\n%s\n```\n\n🤖 Generated by the Refresh API docs workflow.' "$NOTIFY_USER" "$SUMMARY")"; then
              # The refreshed docs ARE pushed to $BRANCH at this point — only the
              # PR wrapper is missing, so say how to finish it by hand.
              echo "::error::Could not open the PR. The refreshed docs are already pushed to '$BRANCH' — open it manually at ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${BASE_BRANCH}...${BRANCH}?expand=1"
              echo "::notice::If this says 'GitHub Actions is not permitted to create or approve pull requests', enable Settings → Actions → General → Workflow permissions → 'Allow GitHub Actions to create and approve pull requests'."
              exit 1
            fi
            # Assignee/reviewer are applied after creation and must not fail
            # the run (the cc @mention in the body already notifies them).
            gh pr edit "$BRANCH" --add-assignee "$NOTIFY_USER" --add-reviewer "$NOTIFY_USER" || true
          else
            # PR already open — force-push above updated it; ping with a comment so
            # the new changes are noticed too.
            gh pr comment "$BRANCH" --body "@${NOTIFY_USER} refreshed with the latest upstream API changes." || true
            echo "Updated existing PR for $BRANCH."
          fi
